name: Release

on:
  push:
    tags: ['cx-*']

permissions:
  contents: write

env:
  LLVM_MINGW_VERSION: "20260616"

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - name: Checkout build scripts
        uses: actions/checkout@v5
        with:
          path: scripts

      - name: Read Wine source ref
        id: ref
        run: echo "ref=$(tr -d '[:space:]' < scripts/wine-src.ref)" >> "$GITHUB_OUTPUT"

      - name: Checkout Wine source
        uses: actions/checkout@v5
        with:
          repository: athei/wine
          ref: ${{ steps.ref.outputs.ref }}
          path: src
          fetch-depth: 1

      - name: Ensure Rosetta 2
        run: |
          if ! arch -x86_64 /usr/bin/true 2>/dev/null; then
            sudo softwareupdate --install-rosetta --agree-to-license
          fi

      # Homebrew no longer ships x86_64 macOS bottles: gmp, sdl2-compat, sdl3
      # and pkgconf have none at all, and gnutls/freetype/bison stop at the
      # sonoma tag, so populating /usr/local means compiling them from source,
      # which took 48 minutes on cx-26.3.0-3 and timed out on cx-26.3.0-4.
      # Cache the whole prefix; the two steps below are guarded and turn into
      # no-ops on a hit. Bump the -v1 by hand when the formula list changes,
      # since an existing cache key is never overwritten.
      - name: Cache x86_64 Homebrew
        uses: actions/cache@v4
        with:
          path: /usr/local
          key: brew-x86_64-macos-26-v1

      - name: Install x86_64 Homebrew
        run: |
          if [ ! -x /usr/local/bin/brew ]; then
            NONINTERACTIVE=1 arch -x86_64 /bin/bash -c \
              "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          fi

      - name: Install build dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_ENV_HINTS: "1"
        run: |
          for attempt in 1 2 3; do
            arch -x86_64 /usr/local/bin/brew install \
              bison pkgconf freetype gnutls sdl2-compat sdl3 && break
            echo "brew install failed on attempt $attempt"
            [ "$attempt" = 3 ] && exit 1
            sleep 30
          done
          echo "/usr/local/opt/bison/bin" >> "$GITHUB_PATH"

      - name: Install llvm-mingw
        run: |
          curl -fsSL -o /tmp/llvm-mingw.tar.xz \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-macos-universal.tar.xz"
          tar -xJf /tmp/llvm-mingw.tar.xz -C "$HOME"
          mv "$HOME/llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-macos-universal" "$HOME/llvm-mingw"

      - name: Build Wine
        run: MINGW_DIR="$HOME/llvm-mingw" scripts/build-wine.sh --clean

      # compatdb.so is a Rust cdylib built by bundle-wine.sh for the x86_64
      # Wine; the runner is arm64, so the target has to be added.
      - name: Add the x86_64 Rust target
        run: rustup target add x86_64-apple-darwin

      # The Direct3D redistributables bundle-wine.sh downloads. Keyed on the
      # pin file, so a version bump is the only thing that invalidates it.
      - name: Cache redistributables
        uses: actions/cache@v4
        with:
          path: cache
          key: redist-${{ hashFiles('scripts/redist.env') }}

      - name: Bundle distribution
        run: MINGW_DIR="$HOME/llvm-mingw" scripts/bundle-wine.sh --dest "$GITHUB_WORKSPACE/dist"

      - name: Create tarball
        run: |
          XZ_OPT="-T0" gtar -C dist -cJf "wine-${GITHUB_REF_NAME}-macos-x86_64.tar.xz" wine

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes "Wine distribution built from athei/wine@${{ steps.ref.outputs.ref }}" \
            "wine-${GITHUB_REF_NAME}-macos-x86_64.tar.xz"
