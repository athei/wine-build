name: Release

on:
  push:
    tags: ['cx-*']

permissions:
  contents: write

env:
  LLVM_MINGW_VERSION: "20260616"
  # The prebuilt x86_64 prefix, produced by package-deps.sh. See the
  # "Install the x86_64 dependency prefix" step for why it is not brew.
  DEPS_URL: "https://github.com/athei/wine-build/releases/download/deps-2026-09-06/wine-deps-macos-x86_64.tar.xz"
  DEPS_SHA256: "2ec5966b63c0041dc2e3f121c9d9da835567f142d560f444eb2c76be51276a34"

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - name: Checkout build scripts
        uses: actions/checkout@v5
        with:
          path: scripts

      - name: Read Wine source ref
        id: ref
        run: echo "ref=$(tr -d '[:space:]' < scripts/wine-src.ref)" >> "$GITHUB_OUTPUT"

      - name: Checkout Wine source
        uses: actions/checkout@v5
        with:
          repository: athei/wine
          ref: ${{ steps.ref.outputs.ref }}
          path: src
          fetch-depth: 1

      - name: Ensure Rosetta 2
        run: |
          if ! arch -x86_64 /usr/bin/true 2>/dev/null; then
            sudo softwareupdate --install-rosetta --agree-to-license
          fi

      # Homebrew has stopped shipping x86_64 macOS bottles: gmp, sdl2-compat
      # and sdl3 have none at all and the rest stop at the sonoma tag, so
      # installing these on a runner means compiling them from source. That
      # took 48 minutes on cx-26.3.0-3 and then stopped working entirely,
      # because gmp's source cannot be fetched here at all: the runners
      # resolve neither ftpmirror.gnu.org nor gmplib.org. package-deps.sh
      # builds the prefix once on a machine that has an Intel Homebrew and it
      # is mirrored as a release asset; bump DEPS_URL and DEPS_SHA256 when it
      # is rebuilt.
      - name: Install the x86_64 dependency prefix
        run: |
          curl -fsSL --retry 3 -o /tmp/wine-deps.tar.xz "$DEPS_URL"
          echo "$DEPS_SHA256  /tmp/wine-deps.tar.xz" | shasum -a 256 -c -
          sudo tar -C /usr/local -xJf /tmp/wine-deps.tar.xz
          echo "/usr/local/opt/bison/bin" >> "$GITHUB_PATH"

      # configure locates the shipped libraries through their .pc files, so it
      # needs a pkg-config. The image's native one only parses text, so its
      # architecture does not matter; fail loudly rather than silently build a
      # Wine with freetype, gnutls and SDL quietly missing.
      - name: Check pkg-config is available
        run: |
          command -v pkg-config >/dev/null || {
            echo "No pkg-config on the runner image."
            echo "Add pkgconf to package-deps.sh rather than installing it here."
            exit 1
          }
          pkg-config --version

      - name: Install llvm-mingw
        run: |
          curl -fsSL -o /tmp/llvm-mingw.tar.xz \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-macos-universal.tar.xz"
          tar -xJf /tmp/llvm-mingw.tar.xz -C "$HOME"
          mv "$HOME/llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-macos-universal" "$HOME/llvm-mingw"

      - name: Build Wine
        run: MINGW_DIR="$HOME/llvm-mingw" scripts/build-wine.sh --clean

      # compatdb.so is a Rust cdylib built by bundle-wine.sh for the x86_64
      # Wine; the runner is arm64, so the target has to be added.
      - name: Add the x86_64 Rust target
        run: rustup target add x86_64-apple-darwin

      # The Direct3D redistributables bundle-wine.sh downloads. Keyed on the
      # pin file, so a version bump is the only thing that invalidates it.
      - name: Cache redistributables
        uses: actions/cache@v4
        with:
          path: cache
          key: redist-${{ hashFiles('scripts/redist.env') }}

      - name: Bundle distribution
        run: MINGW_DIR="$HOME/llvm-mingw" scripts/bundle-wine.sh --dest "$GITHUB_WORKSPACE/dist"

      - name: Create tarball
        run: |
          XZ_OPT="-T0" gtar -C dist -cJf "wine-${GITHUB_REF_NAME}-macos-x86_64.tar.xz" wine

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes "Wine distribution built from athei/wine@${{ steps.ref.outputs.ref }}" \
            "wine-${GITHUB_REF_NAME}-macos-x86_64.tar.xz"
